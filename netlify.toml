[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Ensure correct MIME for video
[[headers]]
  for = "/assets/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.mp4"
  [headers.values]
    Content-Type = "video/mp4"

[[headers]]
  for = "*.mov"
  [headers.values]
    Content-Type = "video/quicktime"

# Fallback for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
